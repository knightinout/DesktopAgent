[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-agent"
description = "AI-powered Linux desktop assistant for file organization and system automation"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Desktop Agent Contributors"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: System :: Systems Administration", 
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10", 
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications",
]
keywords = ["ai", "assistant", "desktop", "linux", "automation", "file-organizer", "xfce", "ubuntu"]
requires-python = ">=3.8"
dependencies = [
    "anthropic==0.64.0",
    "python-dotenv==1.0.0", 
    "loguru==0.7.2",
    "watchdog==3.0.0",
    "requests==2.31.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/knightinout/DesktopAgent"
Repository = "https://github.com/knightinout/DesktopAgent" 
Issues = "https://github.com/knightinout/DesktopAgent/issues"
Documentation = "https://github.com/knightinout/DesktopAgent#readme"

[project.scripts]
desktop-agent = "main:main"

[tool.setuptools.packages.find]
exclude = ["tests*", "docs*"]

[tool.setuptools_scm]
write_to = "desktop_agent/_version.py"